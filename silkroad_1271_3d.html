    if(window._vegG){window._vegG.visible=false;} if(window._vegT){window._vegT.visible=false;}
    /* Kris: NO snap on arrival - the orbit is a DESIRED position and the same springs carry you there */
    const _od=new THREE.Vector3(target.x+camR*Math.sin(camPhi)*Math.sin(camTheta), target.y+camR*Math.cos(camPhi), target.z+camR*Math.sin(camPhi)*Math.cos(camTheta));
    camPos.lerp(_od,0.12); camAim.lerp(target,0.10);
    camera.position.copy(camPos); camera.lookAt(camAim);
  }
  if(marker){ window._mkS=(window._mkS==null)?0.7:window._mkS; var _mkT=riding?(worldY(150)/0.55):0.7; window._mkS+=(_mkT-window._mkS)*0.06; /* riding: a ~300m-wide caravan blob, VEX-aware */ marker.scale.setScalar(window._mkS); } /* the caravan grows into a town marker, no pop */
  if(window._sky)window._sky.position.copy(camera.position);
  renderer.render(scene,camera);
}
function addEvents(){ let drag=false,lx=0,ly=0;
  const c=document.getElementById('c');
  c.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  addEventListener('mouseup',()=>drag=false);
  addEventListener('mousemove',e=>{ if(!drag||riding)return; camTheta-=(e.clientX-lx)*0.005; camPhi=Math.max(0.25,Math.min(1.45,camPhi-(e.clientY-ly)*0.004)); lx=e.clientX;ly=e.clientY; });
  c.addEventListener('wheel',e=>{ if(riding)return; camR=Math.max(18,Math.min(700,camR*(1+Math.sign(e.deltaY)*0.1))); e.preventDefault(); },{passive:false});
  addEventListener('resize',resize);
}
function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
</script></body></html>
