    for(const [wx,wz,sx,sz] of [[0,-r*0.8,r*1.7,0.16],[0,r*0.8,r*1.7,0.16],[-r*0.85,0,0.16,r*1.6],[r*0.85,0,0.16,r*1.6]]){
      const wl=new THREE.Mesh(new THREE.BoxGeometry(sx,0.55,sz),mud); wl.position.set(wx,0.45,wz); g.add(wl); }
    for(const [tx,tz] of [[-r*0.85,-r*0.8],[r*0.85,-r*0.8],[-r*0.85,r*0.8],[r*0.85,r*0.8]]){
      const tw=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.9,6),mud); tw.position.set(tx,0.6,tz); g.add(tw); }
    const n=big?9:5;
    for(let i=0;i<n;i++) house(g,(Math.random()-0.5)*r*1.2,(Math.random()-0.5)*r*1.1,0.4+Math.random()*0.3,0.3+Math.random()*0.3);
    if(big){ dome(g,r*0.25,-r*0.2,0.4); minaret(g,-r*0.3,r*0.15,1.8); }
    else minaret(g,0.2,0.2,1.2);
    g.position.set(x,hAt(x,z)-0.06,z); g.traverse(o=>{o.castShadow=true;}); scene.add(g); }   // footings sunk into the slope, no golden coasters
  walled(MARKS.Samarkand[0],MARKS.Samarkand[1],2.4,true);
  walled(MARKS.Andijan[0],MARKS.Andijan[1],1.7,false);
  walled(MARKS.Kashgar[0],MARKS.Kashgar[1],2.2,true);
  // Dizak: the little fort itself, in miniature (it has its own scene, after all)
  const dz=new THREE.Group();
  for(const [wx,wz,sx,sz] of [[0,-0.55,1.2,0.14],[0,0.55,1.2,0.14],[-0.6,0,0.14,1.1],[0.6,0,0.14,1.1]]){
    const wl=new THREE.Mesh(new THREE.BoxGeometry(sx,0.4,sz),mud); wl.position.set(wx,0.3,wz); dz.add(wl); }
  for(const [tx,tz] of [[-0.6,-0.55],[0.6,-0.55],[-0.6,0.55],[0.6,0.55]]){
    const tw=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,0.65,6),mud); tw.position.set(tx,0.42,tz); dz.add(tw); }
  dz.position.set(MARKS.Dizak[0],hAt(MARKS.Dizak[0],MARKS.Dizak[1])-0.05,MARKS.Dizak[1]); scene.add(dz);
  for(const nm of ['Khujand','Osh']){
    const g=new THREE.Group();
    for(let i=0;i<3;i++) house(g,(Math.random()-0.5)*0.9,(Math.random()-0.5)*0.9,0.35,0.3);
    g.position.set(MARKS[nm][0],hAt(MARKS[nm][0],MARKS[nm][1])-0.05,MARKS[nm][1]); scene.add(g); }
}
function bactrian(){
  const g=new THREE.Group(), hide=mat(0x6e5236);
  const body=new THREE.Mesh(new THREE.SphereGeometry(1.15,9,7),hide); body.scale.set(0.62,0.95,1.5); body.position.y=1.9; g.add(body);   // a beast, not a barrel (Kris)
  for(const hx of [-0.62,0.5]){ const hump=new THREE.Mesh(new THREE.SphereGeometry(0.5,7,5),hide);
    hump.position.set(0,2.8,hx); hump.scale.set(0.75,1.2,0.85); g.add(hump); }
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.4,1.9,6),hide); neck.rotation.z=-0.7; neck.position.set(0,2.4,1.55); g.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.35,7,5),hide); head.scale.set(0.8,0.8,1.5); head.position.set(0,3.05,2.3); g.add(head);
  for(const [lz,lx] of [[-0.9,-0.45],[-0.9,0.45],[0.9,-0.45],[0.9,0.45]]){
    const l=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.12,1.9,5),hide); l.position.set(lx*0.72,0.95,lz); g.add(l); }
  const bale=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.55,0.8),mat(0x7d6236)); bale.position.set(0,3.0,-0.06); g.add(bale);
  g.traverse(o=>{o.castShadow=true;});
  g.scale.setScalar(0.16);
  scene.add(g); return g;
}
function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,1200);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x171310);
  scene.add(new THREE.HemisphereLight(0xf2ead8,0x3a3128,0.95));
  const sun=new THREE.DirectionalLight(0xfff2d0,1.0); sun.position.set(-40,60,20);
  sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
  const sc=sun.shadow.camera; sc.left=-40; sc.right=40; sc.top=40; sc.bottom=-40; sc.far=300; scene.add(sun);
  ground();
  for(let i=0;i<4;i++) caravan.push(bactrian());
  addEvents(); loop();
}
function addEvents(){
  let drag=false,lx=0,ly=0; const c=document.getElementById('c');
  c.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  addEventListener('mouseup',()=>drag=false);
  addEventListener('mousemove',e=>{ if(!drag)return;
    camTheta-=(e.clientX-lx)*0.005; camPhi=Math.max(0.12,Math.min(1.4,camPhi-(e.clientY-ly)*0.004)); lx=e.clientX; ly=e.clientY; });
  c.addEventListener('wheel',e=>{ camR=Math.max(4,Math.min(190,camR*(e.deltaY>0?1.09:0.92))); e.preventDefault(); },{passive:false});
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  document.getElementById('again').addEventListener('click',()=>{ frac=0; });
}
const CALLS=[[0,0.10,'Out the Samarkand gate, the Zarafshan gardens falling behind.'],
 [0.10,0.17,'Dizak — the little fort at the edge of the Hungry Steppe.'],
 [0.24,0.31,'Khujand on the Jaxartes; the Fergana gate opens.'],
 [0.31,0.49,'Up the valley road — the quilt of fields either side.'],
 [0.49,0.55,'Andijan — the last full market before the mountains.'],
 [0.55,0.62,'Osh, below the passes; fodder and farewells.'],
 [0.62,0.85,'The Alay road over the roof of the world.'],
 [0.85,0.96,'Down the long far slope — the desert rim of Kashgaria.'],
 [0.96,1.01,'Kashgar — the oasis under the Tian Shan.']];
const lerp=(a,b,q)=>a+(b-a)*q;
function loop(){
  requestAnimationFrame(loop);
  const t=(Date.now()-t0)/1000, dt=Math.min(0.05,t-tPrev||0.016); tPrev=t;
  frac=Math.min(1,frac+dt/(DAYS*2.0));                     // game pace: ~2 s to the day
  let lead=null;
  for(let i=0;i<caravan.length;i++){
    const f=Math.max(0.0005,Math.min(0.9995,frac-i*0.004));
    const p=CURVE.getPointAt(f), tg=CURVE.getTangentAt(f);
    const y=hAt(p.x,p.z);
    const g=caravan[i];
    g.position.set(p.x,y+0.02+Math.abs(Math.sin(t*6+i*1.3))*0.015,p.z);
    const hd=Math.atan2(tg.x,tg.z);
    if(g.userData.hd===undefined) g.userData.hd=hd;
    g.userData.hd+=wrapA(hd-g.userData.hd)*Math.min(1,dt*2.5);
    g.rotation.y=g.userData.hd;
    g.rotation.z=Math.sin(t*6+i*1.3)*0.03;
    if(i===0) lead=g;
  }
  const day=Math.min(DAYS,1+Math.floor(frac*DAYS));
  let call='';
  for(const [a,b,txt] of CALLS){ if(frac>=a&&frac<b){ call=txt; break; } }
  document.getElementById('note').textContent=(frac>=1?'Journey’s end · ':'Day '+day+' of '+DAYS+' · ')+call;
  if(lead){
    const ct=new THREE.Vector3(lead.position.x,lead.position.y+0.8,lead.position.z);
    camera.position.set(ct.x+camR*Math.cos(camPhi)*Math.cos(camTheta),ct.y+camR*Math.sin(camPhi),ct.z+camR*Math.cos(camPhi)*Math.sin(camTheta));
    camera.lookAt(ct);
  }
  renderer.render(scene,camera);
}
init();
</script></body></html>
